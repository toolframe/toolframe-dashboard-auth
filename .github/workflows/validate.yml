name: Validate package

on:
  workflow_call:

permissions:
  contents: read

# Concurrency belongs to the caller, so validation cannot cancel a publish run.
jobs:
  validate:
    name: Python 3.14.7 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    steps:
      - name: Check out this revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: toolframe-dashboard-auth
          persist-credentials: false

      - name: Check out the pinned SDK
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # repository_owner is the base repository owner for fork PRs.
          repository: ${{ vars.TOOLFRAME_REPOSITORY_OWNER || github.repository_owner }}/toolframe-sdk
          token: ${{ secrets.TOOLFRAME_READ_TOKEN || github.token }}
          ref: 2cd153ec36c585a9adb5ad566effc2985d9e222d
          path: toolframe-sdk
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14.7'

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: '0.12.8'
          enable-cache: false

      - name: Validate from fresh environments
        id: validate
        working-directory: toolframe-dashboard-auth
        shell: bash
        run: bash scripts/ci.sh

      - name: Retain validated distributions
        if: matrix.os == 'ubuntu-24.04'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dashboard-auth-dist-${{ github.sha }}
          path: |
            ${{ steps.validate.outputs.dist-dir }}/*.whl
            ${{ steps.validate.outputs.dist-dir }}/*.tar.gz
          if-no-files-found: error
          retention-days: 7
