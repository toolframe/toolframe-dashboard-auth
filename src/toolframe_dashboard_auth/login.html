<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sign in · Toolframe</title>
<style>
:root{color-scheme:light dark;font-family:system-ui,sans-serif}body{max-width:28rem;margin:15vh auto;padding:2rem}h1{font-size:2rem}label,input,button{display:block;width:100%;box-sizing:border-box}input,button{font:inherit;padding:.85rem;margin:.6rem 0 1.2rem;border-radius:.5rem;border:1px solid #888}button{cursor:pointer;background:#2369d8;color:white;border:0}#error{color:#e96565}p{line-height:1.5}a{color:#579aff}
</style>
<h1>Toolframe</h1><p>Enter your access password to open the Dashboard.</p>
<form method="post" action="/_toolframe/auth/login">
<label for="password">Access password</label><input id="password" name="password" type="password" required maxlength="1024" autocomplete="current-password" autofocus>
<button>Sign in</button><p id="error" role="alert"></p></form>
<p><a href="/_toolframe/session">Operator sign in</a></p>
<script>
document.querySelector('form').addEventListener('submit',async event=>{
 event.preventDefault();const button=document.querySelector('button'),error=document.querySelector('#error');button.disabled=true;error.textContent='';
 try{const response=await fetch('/_toolframe/auth/login',{method:'POST',headers:{'Content-Type':'application/json','Accept':'application/json'},body:JSON.stringify({password:document.querySelector('#password').value})});
 const data=await response.json();if(response.ok){location.assign('/')}else{error.textContent=data.error?.message||'Sign in failed. Please retry.'}}
 catch{error.textContent='Connection interrupted. Please retry.'}finally{button.disabled=false}
});
</script></html>
