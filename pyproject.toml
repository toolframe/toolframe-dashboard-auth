[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "toolframe-dashboard-auth"
version = "0.2.2"
description = "Password login and access management pages for Toolframe"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "byfb", email = "62798989+byfb@users.noreply.github.com" }]
requires-python = ">=3.14"
dependencies = ["toolframe-sdk>=0.4.1,<1"]

[project.urls]
Homepage = "https://github.com/toolframe/toolframe-dashboard-auth"
Repository = "https://github.com/toolframe/toolframe-dashboard-auth"
Documentation = "https://github.com/toolframe/toolframe-dashboard-auth#readme"
Issues = "https://github.com/toolframe/toolframe-dashboard-auth/issues"

[project.entry-points."toolframe.plugins"]
dashboard-auth = "toolframe_dashboard_auth.plugin:plugin"

[project.optional-dependencies]
ui = ["streamlit==1.61.0"]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.12,<1", "streamlit==1.61.0"]

[tool.uv.sources]
toolframe-sdk = { path = "../toolframe-sdk", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py314"
